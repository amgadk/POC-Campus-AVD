# Spine Switches

l3spine:
  defaults:
    platform: vEOS-lab
    spanning_tree_mode: mstp
    spanning_tree_priority: 4096
    bgp_as: 65000
    loopback_ipv4_pool: 10.255.0.0/24
    mlag_peer_l3_ipv4_pool: 10.255.1.0/24
    virtual_router_mac_address: 00:1c:73:00:dc:01
    mlag_peer_ipv4_pool: 172.16.100.0/24
    mlag_interfaces: [Ethernet47, Ethernet48]
  nodes:
    - name: CSW01
      id: 1
      mgmt_ip: 192.168.0.111/24
    - name: CSW02
      id: 2
      mgmt_ip: 192.168.0.112/24

l2leaf:
  defaults:
    platform: vEOS-lab
    uplink_interfaces: [Ethernet25, Ethernet26] # Leaf uplinks
    uplink_switches: [CSW01, CSW02] # Where the leaf uplinks go
    mlag_interfaces: [Ethernet27, Ethernet28] # MLAG peer link
    mlag_peer_ipv4_pool: 10.255.252.0/24 # MLAG peer IPs
    mlag_peer_l3_ipv4_pool: 10.255.251.0/24 # iBGP peering between MLAG peers
    virtual_router_mac_address: 00:1c:73:00:00:99 # The vMAC for the anycast gateways
    spanning_tree_mode: mstp # Spanning Tree is still enabled even in EVPN setups
    spanning_tree_priority: 16384 

  node_groups: 
    - group: Rack1
    # bgp_as is configured automatically from the range, but can be overriden
      nodes:
        - name: ASW01
          id: 3
          mgmt_ip: 192.168.0.101/24
          uplink_switch_interfaces: [Ethernet1, Ethernet1]
        - name: ASW02
          id: 4
          mgmt_ip: 192.168.0.102/24
          uplink_switch_interfaces: [Ethernet2, Ethernet2]

